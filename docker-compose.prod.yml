version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: grandledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: grandledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/migrations/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: grandledger-redis
    restart: unless-stopped
    networks:
      - backend

  api:
    build: .
    container_name: grandledger-api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/grandledger
      - REDIS_URL=redis://redis:6379/0
    image: grandledger/api:latest
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: grandledger-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/nginx/ssl
      - ./web/out:/app/web/out:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  ssl_certs:
