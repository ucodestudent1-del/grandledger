name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grandledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type check with mypy
        run: mypy src --ignore-missing-imports

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/grandledger_test
        run: |
          alembic upgrade head

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/grandledger_test
          SECRET_KEY: ci-secret-key
        run: pytest tests/unit -v --cov=src --cov-report=xml --cov-fail-under=60

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/grandledger_test
          SECRET_KEY: ci-secret-key
        run: pytest tests/integration -v --cov=src --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  lint-and-test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: ./web
        run: npm run build

      - name: Lint
        working-directory: ./web
        run: npm run lint

      - name: Type check
        working-directory: ./web
        run: npm run typecheck

      - name: Run tests
        working-directory: ./web
        run: npm test -- --ci --coverage

  lint-dockerfile:
    needs: [lint-and-test-backend, lint-and-test-frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: |
          pip install dockerfile-parse
          python -c "
          from dockerfile_parse import DockerfileParser
          dfp = DockerfileParser('./Dockerfile')
          print('Dockerfile base image:', dfp.baseimage)
          assert 'python' in dfp.baseimage, 'Backend Dockerfile must use Python base image'
          print('Dockerfile linting passed')
          "

  build-docker:
    needs: [lint-and-test-backend, lint-and-test-frontend, lint-dockerfile]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push unified image (frontend + API)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/grandledger:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
