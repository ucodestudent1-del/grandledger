[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
mypy_path = .
ignore_missing_imports = True

[mypy-tests.*]
ignore_errors = True

[mypy-src.api.v1.*]
ignore_errors = True

[mypy-src.core.*]
ignore_errors = True

[mypy-src.services.*]
ignore_errors = True
