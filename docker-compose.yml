version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: grandledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grandledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/migrations/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grandledger-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: grandledger-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./web
    container_name: grandledger-web
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./web:/app
    depends_on:
      - api

volumes:
  postgres_data:
